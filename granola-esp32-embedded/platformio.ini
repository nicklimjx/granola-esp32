; Granola bop-it — ESP32 firmware
;
; Boards:
;   [env:amoled18]  Waveshare ESP32-S3-Touch-AMOLED-1.8  (board ID 1) — implemented
;   [env:lcd146]    Waveshare ESP32-S3-Touch-LCD-1.46    (board ID 2) — not yet implemented
;
; Wi-Fi / WebSocket settings live in include/secrets.h (gitignored).
; Copy include/secrets.example.h -> include/secrets.h and fill it in.

[env]
; PlatformIO's official espressif32 platform is still on Arduino-ESP32 core
; 2.0.17, which the AMOLED display driver stack no longer builds against. The
; pioarduino fork is the maintained way to get core 3.x under PlatformIO.
; 55.03.311 = Arduino core 3.3.11 / ESP-IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
	-D CORE_DEBUG_LEVEL=3
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
lib_deps =
	links2004/WebSockets@^2.7.3
	bblanchon/ArduinoJson@^7.4.3
	moononournation/GFX Library for Arduino@^1.6.7

[env:amoled18]
board = esp32-s3-devkitc-1
; ESP32-S3R8: 16 MB QSPI flash + 8 MB octal (OPI) PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
	${env.build_flags}
	-D BOARD_AMOLED_18=1
	-D BOARD_HAS_PSRAM=1

; Second player. The pin map still needs to be filled in from the LCD-1.46
; schematic before this env will build; see include/board_config.h.
;[env:lcd146]
;board = esp32-s3-devkitc-1
;board_build.arduino.memory_type = qio_opi
;board_upload.flash_size = 16MB
;board_build.partitions = default_16MB.csv
;build_flags =
;	${env.build_flags}
;	-D BOARD_LCD_146=1
;	-D BOARD_HAS_PSRAM=1
