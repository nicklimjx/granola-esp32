; Granola bop-it - ESP32 firmware
;
; Arduino-ESP32's built-in BLE library provides the direct browser transport;
; no Wi-Fi credentials or WebSocket library are required.

[env]
; 55.03.311 = Arduino core 3.3.11 / ESP-IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
	-D CORE_DEBUG_LEVEL=3
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
lib_deps =
	bblanchon/ArduinoJson@^7.4.3
	moononournation/GFX Library for Arduino@^1.6.7

[env:amoled18]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
	${env.build_flags}
	-D BOARD_AMOLED_18=1
	-D BOARD_HAS_PSRAM=1

; The LCD-1.46 pin map is not yet implemented.
;[env:lcd146]
;board = esp32-s3-devkitc-1
