<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Granola Lobby</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #111318; color: #f7f7f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #242938, #111318 55%); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.25rem clamp(1rem, 4vw, 3rem); }
    h1 { margin: 0; font-size: clamp(1.4rem, 3vw, 2rem); }
    #summary { color: #aeb5c4; margin-top: .25rem; }
    button { border: 0; border-radius: .55rem; padding: .75rem 1.25rem; background: #6c63ff; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { background: #464b57; color: #aeb5c4; cursor: default; }
    main { padding: 0 clamp(1rem, 4vw, 3rem) 3rem; }
    #boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 1rem; }
    .board { position: relative; min-height: 11rem; padding: 1.25rem; border: 1px solid #383e4b; border-radius: .9rem; background: #222631; box-shadow: 0 .4rem 1.5rem #0004; }
    .board h2 { margin: 0; font-size: 1.15rem; overflow-wrap: anywhere; }
    .status { display: inline-block; margin-top: .65rem; padding: .2rem .55rem; border-radius: 999px; background: #363c49; color: #cbd0da; font-size: .8rem; text-transform: capitalize; }
    .playing .status { background: #295f4e; color: #9df1d2; }
    .disconnected { opacity: .55; }
    .instruction { margin: 1.4rem 0 0; font-size: 1.55rem; font-weight: 800; text-transform: uppercase; }
    .score { position: absolute; right: 1.25rem; bottom: 1rem; color: #aeb5c4; }
    #empty { color: #aeb5c4; text-align: center; padding: 15vh 1rem; }
  </style>
</head>
<body>
  <header>
    <div><h1>Granola Lobby</h1><div id="summary">Connecting...</div></div>
    <button id="start" disabled>Start game</button>
  </header>
  <main><div id="boards"></div><div id="empty">Waiting for boards to connect</div></main>
  <script>
    const boards = document.querySelector('#boards');
    const empty = document.querySelector('#empty');
    const summary = document.querySelector('#summary');
    const start = document.querySelector('#start');
    let state = { boards: [], started: false };
    const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/dashboard`);

    function render(next) {
      state = next;
      boards.replaceChildren(...next.boards.map(board => {
        const tile = document.createElement('section');
        tile.className = `board ${board.status}`;
        const title = document.createElement('h2');
        title.textContent = board.boardId;
        const status = document.createElement('span');
        status.className = 'status';
        status.textContent = board.status;
        const instruction = document.createElement('p');
        instruction.className = 'instruction';
        instruction.textContent = board.instruction?.action || (next.started ? 'Waiting' : 'Ready');
        const score = document.createElement('div');
        score.className = 'score';
        score.textContent = `Score ${board.score}`;
        tile.append(title, status, instruction, score);
        return tile;
      }));
      empty.hidden = next.boards.length > 0;
      start.disabled = next.started || next.boards.length === 0;
      start.textContent = next.started ? 'Game started' : 'Start game';
      summary.textContent = next.started ? `${next.boards.length} boards locked` : `${next.boards.length} boards connected`;
    }

    socket.addEventListener('open', () => { summary.textContent = 'Connected'; });
    socket.addEventListener('message', event => {
      const message = JSON.parse(event.data);
      if (message.type === 'state') render(message);
    });
    socket.addEventListener('close', () => { summary.textContent = 'Dashboard disconnected'; start.disabled = true; });
    start.addEventListener('click', () => socket.send(JSON.stringify({ type: 'game.start' })));
  </script>
</body>
</html>
