<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Granola Lobby</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #111318; color: #f7f7f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #242938, #111318 55%); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.25rem clamp(1rem, 4vw, 3rem); }
    h1 { margin: 0; font-size: clamp(1.4rem, 3vw, 2rem); }
    #summary { color: #aeb5c4; margin-top: .25rem; text-transform: capitalize; }
    .controls { display: flex; gap: .65rem; }
    button { border: 0; border-radius: .55rem; padding: .75rem 1.25rem; background: #6c63ff; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { background: #464b57; color: #aeb5c4; cursor: default; }
    main { padding: 0 clamp(1rem, 4vw, 3rem) 3rem; }
    #boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 1rem; }
    .board { position: relative; min-height: 11rem; padding: 1.25rem; border: 1px solid #383e4b; border-radius: .9rem; background: #222631; box-shadow: 0 .4rem 1.5rem #0004; }
    .board h2 { margin: 0; font-size: 1.15rem; overflow-wrap: anywhere; }
    .status { display: inline-block; margin-top: .65rem; padding: .2rem .55rem; border-radius: 999px; background: #363c49; color: #cbd0da; font-size: .8rem; text-transform: capitalize; }
    .playing .status { background: #295f4e; color: #9df1d2; }
    .disconnected { opacity: .55; }
    .instruction { margin: 1.4rem 0 0; font-size: 1.55rem; font-weight: 800; text-transform: uppercase; }
    .score { position: absolute; right: 1.25rem; bottom: 1rem; color: #aeb5c4; }
    #empty { color: #aeb5c4; text-align: center; padding: 15vh 1rem; }
  </style>
</head>
<body>
  <header>
    <div><h1>Granola Lobby</h1><div id="summary">Connect a board over Bluetooth</div></div>
    <div class="controls"><button id="connect">Connect board</button><button id="start" disabled>Start game</button></div>
  </header>
  <main><div id="boards"></div><div id="empty">No board connected</div></main>
  <script type="module" src="/app.js"></script>
</body>
</html>
